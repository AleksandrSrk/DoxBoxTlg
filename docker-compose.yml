services:
  backend:
    build: .
    container_name: doxbot_backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./doxbot.db:/app/doxbot.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    container_name: doxbot_bot
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./doxbot.db:/app/doxbot.db
    command: python bot.py
