<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}doxBot admin{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<nav class="nav">
  <a href="/admin">Субъекты</a>
  <a href="/admin/documents">Документы</a>
  <a href="/admin/categories">Категории</a>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<script>
// Поле type="date" само не умеет принимать вставленную дату вида
// "21.03.2025" — браузер ждёт ввод по сегментам руками. Перехватываем
// вставку на любом таком поле во всей админке и раскладываем по месту сами.
document.addEventListener('paste', function (e) {
  var el = e.target;
  if (!(el.tagName === 'INPUT' && el.type === 'date')) return;
  var text = (e.clipboardData || window.clipboardData).getData('text').trim();
  var m = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) {
    m = text.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (m) m = [null, m[3], m[2].padStart(2, '0'), m[1].padStart(2, '0')];
  }
  if (m) {
    e.preventDefault();
    el.value = m[1] + '-' + m[2] + '-' + m[3];
  }
});
</script>
</body>
</html>
